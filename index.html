<!doctype html>
<html lang="es" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    
    <!-- Primary Meta Tags -->
    <title>TvTotal24 | Más de 5.000 Canales en Vivo, Deportes, Películas y Series</title>
    <meta name="title" content="TvTotal24 | Más de 5.000 Canales en Vivo, Deportes, Películas y Series" />
    <meta name="description" content="Disfruta de más de 5.000 canales de televisión en vivo, deportes en directo en Full HD y 4K, y más de 25.000 películas y series completas con TvTotal24. 3 pantallas incluidas. Solicita tu prueba gratis." />
    <meta name="theme-color" content="#020604" />
    <meta name="color-scheme" content="dark light" />

    <script>
      (function() {
        try {
          var theme = localStorage.getItem('tvtotal24_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch(e) {}
      })();
    </script>

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TvTotal24 | Más de 5.000 Canales y 25.000 Películas y Series" />
    <meta property="og:description" content="Televisión prémium en vivo sin contratos ni cortes. Más de 5.000 canales y 25.000 contenidos con 3 pantallas simultáneas. Solicita tu prueba gratis de TvTotal24." />
    <meta property="og:image" content="/images/logo.png" />

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

  </head>
  <body class="bg-slate-50 dark:bg-obsidian-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-neon-electric selection:text-black transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
