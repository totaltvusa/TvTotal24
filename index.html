<!doctype html>
<html lang="es" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    
    <!-- Primary Meta Tags -->
    <title>TvTotal24 | Más de 5.000 Canales en Vivo, Deportes, Películas y Series</title>
    <meta name="title" content="TvTotal24 | Más de 5.000 Canales en Vivo, Deportes, Películas y Series" />
    <meta name="description" content="Disfruta de más de 5.000 canales de televisión en vivo, deportes en directo en Full HD/4K a 60 FPS, y más de 25.000 películas y series completas con TvTotal24. 3 pantallas incluidas. Solicita tu prueba gratis." />
    <meta name="theme-color" content="#020604" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TvTotal24 | Más de 5.000 Canales y 25.000 Películas y Series" />
    <meta property="og:description" content="Televisión prémium en vivo sin contratos ni cortes. Más de 5.000 canales y 25.000 contenidos con 3 pantallas simultáneas. Solicita tu prueba gratis de TvTotal24." />
    <meta property="og:image" content="/images/logo.png" />

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Instant Lightweight Preloader */
      #tvtotal24-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020604;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }
      #tvtotal24-preloader.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .preloader-glow {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preloader-glow::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 230, 118, 0.4) 0%, transparent 70%);
        animation: preloader-pulse 2s infinite ease-in-out;
      }
      .preloader-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(0, 230, 118, 0.15);
        border-top-color: #00e676;
        border-radius: 50%;
        animation: preloader-spin 0.85s linear infinite;
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes preloader-pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.5; }
        50% { transform: scale(1.2); opacity: 1; }
      }
    </style>
  </head>
  <body class="bg-obsidian-950 text-slate-100 antialiased selection:bg-neon-electric selection:text-black">
    <!-- Instant Fast Preloader -->
    <div id="tvtotal24-preloader">
      <img src="/images/logo-transparent.png" alt="TvTotal24" style="height: 64px; width: auto; object-fit: contain; margin-bottom: 18px; filter: drop-shadow(0 0 16px rgba(0,230,118,0.5));" />
      <div class="preloader-glow">
        <div class="preloader-spinner"></div>
      </div>
      <p style="margin-top: 16px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 0.14em; color: #00e676; text-transform: uppercase;">
        Cargando TvTotal24...
      </p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
